<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cartoon portrait of Nanda Kishore K V">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231a15"/>
      <stop offset="1" stop-color="#0f0a08"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#1c1916"/>
  <circle cx="100" cy="90" r="72" fill="#ff5b2e" opacity="0.13"/>

  <!-- hoodie -->
  <path d="M24 200c3-36 30-56 76-58 46 2 73 22 76 58z" fill="#24201d"/>
  <!-- hood around the neck -->
  <path d="M64 150c8-12 20-16 36-16s28 4 36 16c-10 8-22 10-36 10s-26-2-36-10z" fill="#302a26"/>
  <!-- drawstrings -->
  <path d="M90 158v26M110 158v26" stroke="#ff5b2e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M85 122h30v20c0 9-30 9-30 0z" fill="#93583a"/>
  <path d="M85 132q15 8 30 0v-6H85z" fill="#744229" opacity="0.5"/>

  <!-- headphones resting on the neck -->
  <path d="M68 146q32 22 64 0" fill="none" stroke="#0d0b0a" stroke-width="5" stroke-linecap="round"/>
  <rect x="58" y="138" width="14" height="18" rx="6" fill="#ff5b2e"/>
  <rect x="128" y="138" width="14" height="18" rx="6" fill="#ff5b2e"/>

  <!-- ears -->
  <ellipse cx="58" cy="96" rx="8" ry="12" fill="#9c5f3e"/>
  <ellipse cx="142" cy="96" rx="8" ry="12" fill="#9c5f3e"/>

  <!-- face -->
  <path d="M60 82c0-24 18-40 40-40s40 16 40 40v18c0 14-8 24-18 30l-12 7c-6 3-14 3-20 0l-12-7c-10-6-18-16-18-30z" fill="#a86a44"/>

  <!-- hair: neat crop, side part -->
  <path d="M60 88c-4-28 12-50 40-50 30 0 46 20 40 50-2-12-6-20-12-26-12 4-30 2-42-6-10 6-20 16-26 32z" fill="url(#hair)"/>
  <path d="M86 56c10 8 28 10 42 6-14 0-28-2-42-6z" fill="#5a4436" opacity="0.7"/>

  <!-- brows -->
  <path d="M72 79l18-2M110 77l18 2" stroke="#1d1612" stroke-width="4.5" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="81" cy="90" rx="4" ry="4.5" fill="#1d1612"/>
  <ellipse cx="119" cy="90" rx="4" ry="4.5" fill="#1d1612"/>
  <circle cx="82.5" cy="88.5" r="1.3" fill="#ffffff"/>
  <circle cx="120.5" cy="88.5" r="1.3" fill="#ffffff"/>

  <!-- nose -->
  <path d="M101 96q-3 10 0 12q-3 1-6 0" fill="none" stroke="#83492c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- easy grin -->
  <path d="M89 117q11 8 22 0" fill="none" stroke="#5c2c1a" stroke-width="3" stroke-linecap="round"/>
</svg>
