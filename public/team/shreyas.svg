<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cartoon portrait of Shreyas S Alva">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2420"/>
      <stop offset="1" stop-color="#0d0b0a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b211b"/>
      <stop offset="1" stop-color="#120d0a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#1c1916"/>
  <circle cx="100" cy="90" r="72" fill="#ff5b2e" opacity="0.13"/>

  <!-- jacket -->
  <path d="M24 200c3-36 30-56 76-58 46 2 73 22 76 58z" fill="#24201d"/>
  <!-- tee -->
  <path d="M78 146l22 30 22-30c-7-3-14-4-22-4s-15 1-22 4z" fill="#ff5b2e"/>
  <!-- lapels -->
  <path d="M74 147l26 34-14 19H62z" fill="#302a26"/>
  <path d="M126 147l-26 34 14 19h24z" fill="#302a26"/>

  <!-- neck -->
  <path d="M85 122h30v20c0 9-30 9-30 0z" fill="#ad6f48"/>
  <path d="M85 132q15 8 30 0v-6H85z" fill="#8f5a3a" opacity="0.5"/>

  <!-- ears -->
  <ellipse cx="58" cy="96" rx="8" ry="12" fill="#c4865c"/>
  <ellipse cx="142" cy="96" rx="8" ry="12" fill="#c4865c"/>

  <!-- face: sharper jaw -->
  <path d="M60 82c0-24 18-40 40-40s40 16 40 40v18c0 14-8 24-18 30l-12 7c-6 3-14 3-20 0l-12-7c-10-6-18-16-18-30z" fill="#d3976b"/>
  <!-- stubble -->
  <path d="M66 108c4 12 12 20 22 25l6 3c4 2 8 2 12 0l6-3c10-5 18-13 22-25-6 7-14 9-22 8-6 3-18 3-24 0-8 1-16-1-22-8z" fill="#3a2a20" opacity="0.14"/>

  <!-- hair: swept-up quiff -->
  <path d="M60 90c-4-18-2-32 6-40 2-10 10-18 20-22 4-8 14-12 26-10 6-6 18-6 26 2-6 0-10 2-12 4 14 2 22 14 20 30-1 12-2 22-6 34-2-14-6-22-12-28-8 2-20 0-30-6-4 6-14 8-24 6-6 6-10 14-14 30z" fill="url(#hair)"/>
  <path d="M84 30c8-8 24-12 38-8-10 0-20 4-28 12 10-6 26-6 36 2-14-2-28 0-40 8z" fill="#5a4436"/>
  <path d="M120 26c6 0 12 2 16 6-4-1-9-1-14 0z" fill="#6b5242" opacity="0.8"/>
  <!-- fade on sides -->
  <path d="M60 86c-1-6 0-12 2-16v20z" fill="#2b211b" opacity="0.6"/>
  <path d="M140 86c1-6 0-12-2-16v20z" fill="#2b211b" opacity="0.6"/>

  <!-- brows -->
  <path d="M71 78l20-3M109 75l20 3" stroke="#1d1612" stroke-width="4.5" stroke-linecap="round"/>

  <!-- sunglasses -->
  <path d="M64 84h72" stroke="#0d0b0a" stroke-width="4" stroke-linecap="round"/>
  <path d="M66 84h28c0 12-4 18-14 18s-14-6-14-18z" fill="url(#lens)" stroke="#0d0b0a" stroke-width="2"/>
  <path d="M106 84h28c0 12-4 18-14 18s-14-6-14-18z" fill="url(#lens)" stroke="#0d0b0a" stroke-width="2"/>
  <path d="M72 88l8 0-8 9z" fill="#ffffff" opacity="0.22"/>
  <path d="M112 88l8 0-8 9z" fill="#ffffff" opacity="0.22"/>

  <!-- nose -->
  <path d="M101 98q-3 10 0 13q-3 1-6 0" fill="none" stroke="#a5683f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- smirk -->
  <path d="M91 118q9 4 18-2" fill="none" stroke="#6b3420" stroke-width="3" stroke-linecap="round"/>
  <path d="M109 116l3-3" stroke="#6b3420" stroke-width="2.5" stroke-linecap="round"/>
</svg>
